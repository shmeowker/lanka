{%- if let Some(attachments) = attachments -%}
<ol class="attachments">
{%- for file in attachments.split(",") -%}
	<li class="attachment" data-url="/attachments/{{ file }}">
		<summary>
			<a href="/attachments/{{ file }}" download>
				{{ file }}
			</a>
		</summary>
	</li>
{%- endfor -%}
</ol>
{%- endif %}
