{%- if breadcrumbs is not defined -%}
<option value="" disabled selected>—</option>
{%- endif -%}
{%- for board in boards -%}
<option 
	value="{{ board.name }}"
	{% if breadcrumbs is defined && board.name.as_str() == breadcrumbs[0] -%}
	selected
	{%- endif -%}>
	/{{ board.name }}
</option>
{%- endfor -%}
